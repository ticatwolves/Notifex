# Local stack: `make dev`. Mirrors the AWS shape (docs/10) with local stand-ins:
# Postgres for RDS, ElasticMQ for SQS. Mock vendors and the web console join in
# later phases. Optional tracing UI: `docker compose --profile obs up`.
name: notifex

x-core: &core
  build:
    context: .
    dockerfile: deploy/docker/core.Dockerfile
    args:
      VERSION: ${VERSION:-dev}
  image: notifex-core:local
  env_file:
    - path: .env
      required: false
  environment: &core-env
    NOTIFEX_ENV: local
    LOG_FORMAT: text
    LOG_LEVEL: debug
    DATABASE_URL: postgres://notifex:notifex@postgres:5432/notifex?sslmode=disable
    SQS_ENDPOINT: http://elasticmq:9324
    SMTP_ADDR: mailpit:1025                  # system email -> Mailpit (UI on :8025)
    CONSOLE_BASE_URL: http://localhost:3000
    AWS_REGION: ap-south-1
    AWS_ACCESS_KEY_ID: local       # ElasticMQ ignores credentials
    AWS_SECRET_ACCESS_KEY: local
    # API_KEY_PEPPER / NOTIFEX_LOCAL_MASTER_KEY default to public dev values
    # in local (internal/config); set them in .env to override.
  depends_on:
    migrate:
      condition: service_completed_successfully
    elasticmq:
      condition: service_started
  healthcheck:
    test: ["CMD", "/app/healthcheck", "http://127.0.0.1:9100/healthz"]
    interval: 10s
    timeout: 4s
    retries: 3
    start_period: 5s
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    environment:
      POSTGRES_USER: notifex
      POSTGRES_PASSWORD: notifex  # local only
      POSTGRES_DB: notifex
    # Host port 54320 avoids clashing with a native Postgres on 5432.
    ports: ["${POSTGRES_HOST_PORT:-54320}:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifex -d notifex"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticmq:
    image: softwaremill/elasticmq-native@sha256:e4580ab9ad1bd5cd37b4ba04911bc5ccc8cd2d9ab4de56ece65acee71c24e05c
    ports: ["9324:9324", "9325:9325"]  # SQS API, stats UI
    volumes:
      - ./deploy/docker/elasticmq.conf:/opt/elasticmq.conf:ro

  # One-shot: applies migrations, then exits. Mirrors the pre-deploy ECS task.
  migrate:
    <<: *core
    command: ["/app/migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  # Catches Notifex's own email (verification, reset). UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    ports: ["8025:8025", "1025:1025"]

  api:
    <<: *core
    command: ["/app/api"]
    ports: ["8080:8080", "9090:9090", "9100:9100"]

  dispatcher:
    <<: *core
    command: ["/app/dispatcher"]
    ports: ["9101:9100"]

  scheduler:
    <<: *core
    command: ["/app/scheduler"]
    ports: ["9102:9100"]

  jaeger:
    profiles: [obs]
    image: jaegertracing/jaeger@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    ports: ["16686:16686", "4317:4317"]  # UI, OTLP gRPC

volumes:
  pgdata:
