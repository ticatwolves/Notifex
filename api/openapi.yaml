        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: deleteApplicationPolicy
      tags: [brand-policy]
      summary: Remove the application policy override (admin, owner)
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 2
      responses:
        "204": { description: Removed; the application now uses the tenant policy. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  # ---------------------------------------------------------------- Phase 2: workflows, actions, templates (ADR-012)
  /v1/admin/tenants/{tenant_id}/applications/{application_id}/workflows:
    parameters:
      - $ref: "#/components/parameters/TenantIDPath"
      - $ref: "#/components/parameters/ApplicationIDPath"
    get:
      operationId: listWorkflows
      tags: [workflows]
      summary: List workflows (any member)
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 2
      parameters:
        - { name: status, in: query, description: Filter by status., schema: { $ref: "#/components/schemas/WorkflowStatus" } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: A page of workflows (actions included).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: createWorkflow
      tags: [workflows]
      summary: Create a workflow (developer, admin, owner)
      description: New workflows start as `draft`. A `payload_schema` must be a valid JSON Schema (2020-12, no remote `$ref`, at most 64 KiB).
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/admin/tenants/{tenant_id}/applications/{application_id}/workflows/{workflow_id}:
    parameters:
      - $ref: "#/components/parameters/TenantIDPath"
      - $ref: "#/components/parameters/ApplicationIDPath"
      - $ref: "#/components/parameters/WorkflowIDPath"
    get:
      operationId: getWorkflow
      tags: [workflows]
      summary: Get a workflow with its actions (any member)
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 2
      responses:
        "200":
          description: The workflow.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      operationId: updateWorkflow
      tags: [workflows]
      summary: Update a workflow (developer, admin, owner)
      description: |
        `key` can't change (triggers reference it). Setting `status: active` requires at least one
        enabled action, and every enabled action needs at least one template; otherwise
        `400 validation_failed`. In-flight runs are unaffected (snapshot at accept).
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowPatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: deleteWorkflow
      tags: [workflows]
      summary: Delete a workflow with its actions and templates (developer, admin, owner)
      description: Runs already accepted keep their snapshot and are unaffected.
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 2
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/admin/tenants/{tenant_id}/applications/{application_id}/workflows/{workflow_id}/actions:
    parameters:
      - $ref: "#/components/parameters/TenantIDPath"
      - $ref: "#/components/parameters/ApplicationIDPath"
      - $ref: "#/components/parameters/WorkflowIDPath"
    post:
      operationId: createAction
      tags: [workflows]
      summary: Add a channel action (developer, admin, owner)
      description: |
        One action per channel per workflow (`409 conflict` otherwise). Phase 2 channels are email,
        sms, slack and webhook. On an active workflow a new action must be created with
        `enabled: false` (`409`): add a template, then enable it.
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Action" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/admin/tenants/{tenant_id}/applications/{application_id}/workflows/{workflow_id}/actions/{action_id}:
    parameters:
      - $ref: "#/components/parameters/TenantIDPath"
      - $ref: "#/components/parameters/ApplicationIDPath"
      - $ref: "#/components/parameters/WorkflowIDPath"
      - $ref: "#/components/parameters/ActionIDPath"
    patch:
      operationId: updateAction
      tags: [workflows]
      summary: Enable or disable an action (developer, admin, owner)
      description: |
        On an active workflow, disabling the last enabled action is `409 conflict` (archive the
        workflow instead), and enabling an action that has no template is `409`.
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionPatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Action" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: deleteAction
      tags: [workflows]
      summary: Delete an action and its templates (developer, admin, owner)
      description: Same rule as disabling for the last enabled action of an active workflow.
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 2
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/admin/tenants/{tenant_id}/applications/{application_id}/workflows/{workflow_id}/actions/{action_id}/templates:
    parameters:
      - $ref: "#/components/parameters/TenantIDPath"
      - $ref: "#/components/parameters/ApplicationIDPath"
      - $ref: "#/components/parameters/WorkflowIDPath"
      - $ref: "#/components/parameters/ActionIDPath"
    get:
      operationId: listTemplates
      tags: [workflows]
      summary: List an action's templates, one per locale (any member)
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 2
      responses:
        "200":
          description: All templates of the action (at most 50 locales).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/admin/tenants/{tenant_id}/applications/{application_id}/workflows/{workflow_id}/actions/{action_id}/templates/{locale}:
    parameters:
      - $ref: "#/components/parameters/TenantIDPath"
      - $ref: "#/components/parameters/ApplicationIDPath"
      - $ref: "#/components/parameters/WorkflowIDPath"
      - $ref: "#/components/parameters/ActionIDPath"
      - $ref: "#/components/parameters/LocalePath"
    get:
      operationId: getTemplate
      tags: [workflows]
      summary: Get the template for a locale (any member)
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 2
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    put:
      operationId: putTemplate
      tags: [workflows]
      summary: Create or replace the template for a locale (developer, admin, owner)
      description: |
        Fields used depend on the action's channel (ADR-012 §3); fields for other channels are
        `400 validation_failed`. Syntax errors and channel limit violations are
        `400 template_invalid` with `details` (field, line, column).
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: deleteTemplate
      tags: [workflows]
      summary: Delete the template for a locale (developer, admin, owner)
      description: Deleting the last template of an enabled action in an active workflow is `409 conflict`.
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 2
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/admin/tenants/{tenant_id}/applications/{application_id}/templates/preview:
    parameters:
      - $ref: "#/components/parameters/TenantIDPath"
      - $ref: "#/components/parameters/ApplicationIDPath"
    post:
      operationId: previewTemplate
      tags: [workflows]
      summary: Render an unsaved template with sample data (developer, admin, owner)
      description: |
        Renders with the application's effective brand. Nothing is stored or logged.
        Render failures (syntax, budgets, channel limits) are `400 template_invalid` with `details`.
        The console must show the HTML in a sandboxed iframe (docs/11).
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreviewRequest" }
      responses:
        "200":
          description: Rendered output.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreviewResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  # ---------------------------------------------------------------- Phase 2: channel credentials (ADR-005, ADR-013)
  /v1/admin/channel-providers:
    get:
      operationId: listChannelProviders
      tags: [credentials]
      summary: The provider catalogue (any signed-in user)
      description: Static. Describes each provider's config and secret fields so the console can draw forms.
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 2
      responses:
        "200":
          description: Providers by channel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelProviderList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/admin/tenants/{tenant_id}/channel-credentials:
    parameters:
      - $ref: "#/components/parameters/TenantIDPath"
    get:
      operationId: listChannelCredentials
      tags: [credentials]
      summary: List credential metadata (developer, admin, owner)
      description: Secrets are never returned.
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 2
      parameters:
        - { name: channel, in: query, description: Filter by channel., schema: { $ref: "#/components/schemas/Channel" } }
        - { name: application_id, in: query, description: Filter by application scope., schema: { $ref: "#/components/schemas/ApplicationID" } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: A page of credentials.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelCredentialList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: createChannelCredential
      tags: [credentials]
      summary: Add a credential (admin, owner)
      description: |
        Scope is the tenant, an application, or an application environment. At most one
        non-disabled credential per scope and channel (`409 conflict`). For `webhook/signing`
        the secret is generated and returned once in `generated_secret`. Audited (never the secret).
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelCredentialCreate" }
      responses:
        "201":
          description: Created (status `pending`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelCredentialCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/admin/tenants/{tenant_id}/channel-credentials/resolve:
    parameters:
      - $ref: "#/components/parameters/TenantIDPath"
    get:
      operationId: resolveChannelCredential
      tags: [credentials]
      summary: Which credential a send would use (developer, admin, owner)
      description: The same resolution as trigger acceptance (ADR-013 §5). `200` with `available:false` and the reason when none applies.
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 2
      parameters:
        - { name: channel, in: query, required: true, description: Channel., schema: { $ref: "#/components/schemas/Channel" } }
        - { name: application_id, in: query, required: true, description: Application., schema: { $ref: "#/components/schemas/ApplicationID" } }
        - { name: environment_id, in: query, required: true, description: Environment of that application., schema: { $ref: "#/components/schemas/EnvironmentID" } }
      responses:
        "200":
          description: The resolution result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialResolution" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/admin/tenants/{tenant_id}/channel-credentials/{credential_id}:
    parameters:
      - $ref: "#/components/parameters/TenantIDPath"
      - $ref: "#/components/parameters/CredentialIDPath"
    get:
      operationId: getChannelCredential
      tags: [credentials]
      summary: Get credential metadata (developer, admin, owner)
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 2
      responses:
        "200":
          description: The credential (never the secret).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelCredential" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      operationId: updateChannelCredential
      tags: [credentials]
      summary: Rename, change config, or enable/disable (admin, owner)
      description: Changing `config` does not touch the secret. Re-enabling while another credential is active in the same scope and channel is `409 conflict`. Audited.
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelCredentialPatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelCredential" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: deleteChannelCredential
      tags: [credentials]
      summary: Delete a credential (admin, owner)
      description: Permanent; the encrypted secret is removed. Notifications already accepted with this credential fail permanently at dispatch. Audited.
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 2
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/admin/tenants/{tenant_id}/channel-credentials/{credential_id}/rotate:
    parameters:
      - $ref: "#/components/parameters/TenantIDPath"
      - $ref: "#/components/parameters/CredentialIDPath"
    post:
      operationId: rotateChannelCredential
      tags: [credentials]
      summary: Replace the secret (admin, owner)
      description: |
        Takes effect immediately, including for notifications already accepted. For
        `webhook/signing` send no body; the new secret is returned once in `generated_secret`.
        Providers without a secret are `400 validation_failed`. Audited (never the secret).
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 2
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelCredentialRotate" }
      responses:
        "200":
          description: Rotated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelCredentialCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }

