openapi: 3.1.0
info:
  title: Notifex API
  version: 0.1.0-draft
  summary: Notifications as a service. Trigger workflows and observe every notification.
  description: |
    Source of truth for the Notifex REST API (docs/03). Operations marked
    `x-notifex-status: implemented` are served and contract-tested
    (internal/transport/http/contract_test.go). Operations marked `draft` are
    designed but not yet built; they may change until their phase ships.

    **Identifiers** are opaque strings of the form `<kind>_<22 base62 chars>`
    (`ten_`, `app_`, `env_`, `key_`, `run_`, `ntf_`, `wfl_`, `act_`, `crd_`). Treat them as opaque.

    **Errors** always use the `Error` envelope. Codes are stable strings;
    messages are for humans and may change.

    **Authentication** uses three bearer token kinds, each accepted by exactly
    one route group (ADR-011): API keys `nfx_…` for the data plane (`/v1/whoami`,
    `/v1/trigger`, runs, notifications); console sessions `nfs_…` for `/v1/auth`,
    `/v1/me` and `/v1/admin`; operator sessions `nfo_…` for `/v1/operator`.
    Every credential problem is the same `401 unauthenticated`; `503 unavailable`
    means the check could not be completed and is safe to retry.

    **Roles** (tenant): owner, admin, developer, viewer, per the docs/03 matrix.
    A caller with no membership in the path's tenant gets `404`; an insufficient
    role gets `403 forbidden`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.notifex.dev
    description: Production (ap-south-1)
  - url: http://localhost:8080
    description: Local (make dev)
security:
  - apiKey: []
tags:
  - name: ops
    description: Liveness and readiness.
  - name: identity
    description: Caller identity.
  - name: trigger
    description: Trigger workflows.
  - name: runs
    description: Observe runs and notifications.
  - name: auth
    description: Console accounts and sessions (ADR-011).
  - name: tenants
    description: Tenants (console session).
  - name: members
    description: Members, roles and invitations.
  - name: applications
    description: Applications and environments.
  - name: api-keys
    description: API key lifecycle.
  - name: audit
    description: Audit trail.
  - name: workflows
    description: Workflows, channel actions, templates and preview (ADR-012).
  - name: brand-policy
    description: Brand profiles and policies, per tenant with application overrides.
  - name: credentials
    description: Channel credentials, platform and BYO (ADR-005, ADR-013). Secrets are write-only.
  - name: operator
    description: Platform operator realm (separate accounts, TOTP, fully audited).

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [ops]
      summary: Liveness
      description: Process is up. Never checks dependencies.
      security: []
      x-notifex-status: implemented
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /readyz:
    get:
      operationId: getReadyz
      tags: [ops]
      summary: Readiness
      description: Dependencies are usable. Detail is only available on the internal ops port.
      security: []
      x-notifex-status: implemented
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "503":
          description: Not ready (dependency down or draining).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }

  /v1/whoami:
    get:
      operationId: getWhoami
      tags: [identity]
      summary: Identify the calling API key
      description: Connectivity and credential check for SDKs and CLIs.
      x-notifex-status: implemented
      responses:
        "200":
          description: The caller's tenant, application, environment and key.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhoAmI" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/trigger:
    post:
      operationId: trigger
      tags: [trigger]
      summary: Trigger a workflow
      description: |
        Accepts the trigger and returns `202` with one notification per
        (action × recipient). Each notification is decided independently
        (ADR-014 §3): `channel_not_allowed`, `recipient_missing`,
        `template_missing`, `credential_unavailable` and
        `platform_sms_daily_limit` (with `retry_after`) are reported per
        notification. A valid request is always `202`; if nothing was accepted
        the run's status is `failed`.

        The workflow must be `active` (`404 workflow_not_found`,
        `409 workflow_not_active`). `channels` can only narrow the workflow's
        channels (`400` otherwise). A past `schedule_at` means now; more than
        7 days ahead is `400 schedule_horizon_exceeded`. Retrying with the same
        `Idempotency-Key` and body returns the original run; a different body
        returns `409 idempotency_conflict`.
      x-notifex-status: draft
      x-notifex-phase: 3
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriggerRequest" }
      responses:
        "202":
          description: Accepted.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriggerResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: List runs
      description: Runs for the calling application environment, newest first, keyset-paginated.
      x-notifex-status: draft
      x-notifex-phase: 5
      parameters:
        - { name: workflow, in: query, schema: { type: string, maxLength: 63 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/RunStatus" } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: A page of runs, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/runs/{run_id}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Get a run
      x-notifex-status: draft
      x-notifex-phase: 3
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The run and its notifications' current status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      tags: [runs]
      summary: Cancel a run's pending notifications
      x-notifex-status: draft
      x-notifex-phase: 5
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Pending notifications canceled; already-sent ones are unaffected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/notifications/{notification_id}:
    get:
      operationId: getNotification
      tags: [runs]
      summary: Get a notification and its timeline
      x-notifex-status: draft
      x-notifex-phase: 3
      parameters:
        - $ref: "#/components/parameters/NotificationID"
      responses:
        "200":
          description: The notification with its status timeline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/notifications/{notification_id}/replay:
    post:
      operationId: replayNotification
      tags: [runs]
      summary: Re-dispatch a failed notification from its original snapshot
      x-notifex-status: draft
      x-notifex-phase: 5
      parameters:
        - $ref: "#/components/parameters/NotificationID"
      responses:
        "202":
          description: Replay accepted as a new attempt chain.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`payload_expired`: the payload was purged after the tenant's retention period."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }

  # ---------------------------------------------------------------- Phase 1: console auth (ADR-011)
  /v1/auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create a user account
      description: Always returns 202, whether or not the email is registered (no enumeration). Sends a verification email.
      security: []
      x-notifex-status: implemented
      x-notifex-phase: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "202": { description: Accepted; check email. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /v1/auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Confirm an email address with the emailed token
      security: []
      x-notifex-status: implemented
      x-notifex-phase: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "204": { description: Verified. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      description: Every failure is `401 invalid_credentials`. Repeated failures return `429 account_locked` with Retry-After (progressive backoff, never a hard lock).
      security: []
      x-notifex-status: implemented
      x-notifex-phase: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCreated" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 1
      responses:
        "204": { description: Logged out. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/auth/reauth:
    post:
      operationId: reauthenticate
      tags: [auth]
      summary: Confirm the password to unlock sensitive actions for 10 minutes
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthRequest" }
      responses:
        "204": { description: Session marked recently authenticated. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/auth/password/forgot:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Email a password reset link
      description: Always 202 (no enumeration).
      security: []
      x-notifex-status: implemented
      x-notifex-phase: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202": { description: Accepted. }
        "429": { $ref: "#/components/responses/RateLimited" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /v1/auth/password/reset:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password with a reset token
      description: Revokes every session of the user.
      security: []
      x-notifex-status: implemented
      x-notifex-phase: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "204": { description: Password changed; all sessions revoked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /v1/auth/oauth/{provider}/authorize:
    post:
      operationId: oauthAuthorize
      tags: [auth]
      summary: Start an OAuth login, or link a provider to the signed-in user
      description: |
        Returns the provider URL. State, PKCE verifier and nonce are kept
        server-side (10 min, single use) and bound to the allowlisted
        redirect_uri. Called **with** a console session, it starts a link of
        this provider to that user; the callback must then present the same
        session (prevents linking CSRF).
      security: [{}, { consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 1
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OAuthAuthorizeRequest" }
      responses:
        "200":
          description: Redirect the browser to authorization_url.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthAuthorizeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/auth/oauth/{provider}/callback:
    post:
      operationId: oauthCallback
      tags: [auth]
      summary: Complete an OAuth login or link
      description: |
        Login: `200` with a session. Link (started with a session): `204`.
        `403 email_not_verified` when the provider does not vouch for the
        email (no account lookup happens); `409 link_required` when the email
        belongs to an account that must sign in and link from settings
        (ADR-011 §3 and its amendment).
      security: [{}, { consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 1
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OAuthCallbackRequest" }
      responses:
        "200":
          description: Session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCreated" }
        "204": { description: Identity linked to the signed-in user. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: The current user and their tenant memberships
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 1
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/me/sessions:
    get:
      operationId: listMySessions
      tags: [auth]
      summary: List the current user's active sessions
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 1
      responses:
        "200":
          description: Active sessions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/me/sessions/{session_id}:
    delete:
      operationId: revokeMySession
      tags: [auth]
      summary: Revoke one of the current user's sessions
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 1
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/me/identities:
    get:
      operationId: listMyIdentities
      tags: [auth]
      summary: List the OAuth identities linked to the current user
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 1
      responses:
        "200":
          description: Linked identities.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/me/identities/{provider}:
    delete:
      operationId: unlinkMyIdentity
      tags: [auth]
      summary: Unlink an OAuth provider from the current user
      description: "`409 conflict` if it is the user's last way to sign in (no password and no other identity)."
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 1
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
      responses:
        "204": { description: Unlinked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [members]
      summary: Accept an invitation
      description: The session's user email must match the invited email; accepting verifies it.
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "200":
          description: Membership created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ---------------------------------------------------------------- Phase 1: tenant control plane
  /v1/admin/tenants:
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create a tenant; the caller becomes its owner
      description: Requires a verified email. At most 5 tenants per user. New tenants are sandboxed.
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /v1/admin/tenants/{tenant_id}:
    parameters:
      - $ref: "#/components/parameters/TenantIDPath"
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Get a tenant (any member)
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 1
      responses:
        "200":
          description: The tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      operationId: updateTenant
      tags: [tenants]
      summary: Rename a tenant (admin, owner)
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantPatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
    delete:
      operationId: deleteTenant
      tags: [tenants]
      summary: Delete a tenant and crypto-shred its data (owner, recent re-auth)
      description: Irreversible. Sets status deleted, destroys the tenant DEK, revokes all API keys. `403 reauth_required` without a re-authentication in the last 10 minutes.
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 1
      responses:
        "202": { description: Deleted; encrypted data is unreadable. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/admin/tenants/{tenant_id}/members:
    parameters:
      - $ref: "#/components/parameters/TenantIDPath"
    get:
      operationId: listMembers
      tags: [members]
      summary: List members (any member)
      security: [{ consoleSession: [] }]
      x-notifex-status: implemented
      x-notifex-phase: 1
      parameters:
