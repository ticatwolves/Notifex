components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: "nfx_<env>_<prefix>_<secret><checksum>"
      description: API key for one application environment (docs/03 §API keys).
    consoleSession:
      type: http
      scheme: bearer
      bearerFormat: "nfs_<43 base62>"
      description: Console session token (ADR-011 §1). The web app holds it in an HttpOnly cookie and forwards it.
    operatorSession:
      type: http
      scheme: bearer
      bearerFormat: "nfo_<43 base62>"
      description: Platform operator session (ADR-011 §5).

  headers:
    RequestID:
      description: Request id; echo it when contacting support.
      schema: { type: string, maxLength: 64 }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer, minimum: 0 }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per logical trigger (UUID recommended); reuse it on retries.
      schema: { type: string, minLength: 8, maxLength: 128 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    After:
      name: after
      in: query
      description: Cursor from the previous page's `next_cursor`.
      schema: { type: string, maxLength: 128 }
    RunID:
      name: run_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/RunID" }
    NotificationID:
      name: notification_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/NotificationID" }
    TenantIDPath:
      name: tenant_id
      in: path
      required: true
      description: Tenant id.
      schema: { $ref: "#/components/schemas/TenantID" }
    UserIDPath:
      name: user_id
      in: path
      required: true
      description: User id.
      schema: { $ref: "#/components/schemas/UserID" }
    InvitationIDPath:
      name: invitation_id
      in: path
      required: true
      description: Invitation id.
      schema: { $ref: "#/components/schemas/InvitationID" }
    ApplicationIDPath:
      name: application_id
      in: path
      required: true
      description: Application id.
      schema: { $ref: "#/components/schemas/ApplicationID" }
    EnvironmentIDPath:
      name: environment_id
      in: path
      required: true
      description: Environment id.
      schema: { $ref: "#/components/schemas/EnvironmentID" }
    APIKeyIDPath:
      name: api_key_id
      in: path
      required: true
      description: API key id.
      schema: { $ref: "#/components/schemas/APIKeyID" }
    SessionID:
      name: session_id
      in: path
      required: true
      description: Session id (not the token).
      schema: { $ref: "#/components/schemas/SessionID" }
    OAuthProvider:
      name: provider
      in: path
      required: true
      description: OAuth provider.
      schema: { type: string, enum: [google, microsoft, github] }

  responses:
    BadRequest:
      description: "`validation_failed`, `invalid_token` (expired or used email/reset/invitation token), or `schedule_horizon_exceeded`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: "`unauthenticated` (missing or invalid credentials, one response for every cause) or `invalid_credentials` (failed login)."
      headers:
        WWW-Authenticate:
          description: Always `Bearer realm="notifex"`.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "`forbidden` (role too low), `reauth_required` (sensitive action needs a re-authentication in the last 10 minutes), `email_not_verified`, `tenant_limit_reached`, or `channel_not_allowed`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`not_found` or `workflow_not_found`. Resources of other tenants are indistinguishable from missing ones."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: "`idempotency_conflict` (same Idempotency-Key, different body), `conflict` (duplicate slug/key/email, last owner, still referenced), or `link_required` (OAuth email belongs to an account that must log in to link)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: "`payload_too_large`: body over 1 MiB."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: "`rate_limited`, `account_locked` (login backoff), `quota_exceeded`, or `platform_sms_daily_limit` (when no notification could be accepted)."
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: "`unavailable`: temporarily unable to serve; retry with backoff (and the same Idempotency-Key)."
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    TenantID: { type: string, pattern: "^ten_[0-9A-Za-z]{22}$", examples: ["ten_0FXq3c7yH1nBkZ2pR9sLmA"] }
    ApplicationID: { type: string, pattern: "^app_[0-9A-Za-z]{22}$" }
    EnvironmentID: { type: string, pattern: "^env_[0-9A-Za-z]{22}$" }
    APIKeyID: { type: string, pattern: "^key_[0-9A-Za-z]{22}$" }
    RunID: { type: string, pattern: "^run_[0-9A-Za-z]{22}$" }
    NotificationID: { type: string, pattern: "^ntf_[0-9A-Za-z]{22}$" }
    UserID: { type: string, pattern: "^usr_[0-9A-Za-z]{22}$" }
    MembershipID: { type: string, pattern: "^mem_[0-9A-Za-z]{22}$" }
    InvitationID: { type: string, pattern: "^inv_[0-9A-Za-z]{22}$" }
    SessionID: { type: string, pattern: "^ses_[0-9A-Za-z]{22}$" }
    AuditEventID: { type: string, pattern: "^evt_[0-9A-Za-z]{22}$" }

    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorDetail" }
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
        request_id: { type: string, maxLength: 64 }
        retry_after:
          type: string
          format: date-time
          description: For per-notification limits, when the limit resets.
    ErrorCode:
      type: string
      description: Stable machine-readable error code (docs/03 §Error codes).
      enum:
        - validation_failed
        - schedule_horizon_exceeded
        - unauthenticated
        - invalid_credentials
        - invalid_token
        - account_locked
        - forbidden
        - reauth_required
        - email_not_verified
        - tenant_limit_reached
        - link_required
        - conflict
        - channel_not_allowed
        - not_found
        - workflow_not_found
        - method_not_allowed
        - idempotency_conflict
        - payload_expired
        - payload_too_large
        - rate_limited
        - quota_exceeded
        - credential_unavailable
        - platform_sms_daily_limit
        - internal
        - unavailable

    EnvironmentName: { type: string, enum: [dev, staging, prod] }

    WhoAmI:
      type: object
      additionalProperties: false
      required: [tenant_id, application_id, environment_id, environment, api_key_id, api_key_prefix, scopes]
      properties:
        tenant_id: { $ref: "#/components/schemas/TenantID" }
        application_id: { $ref: "#/components/schemas/ApplicationID" }
        environment_id: { $ref: "#/components/schemas/EnvironmentID" }
        environment: { $ref: "#/components/schemas/EnvironmentName" }
        api_key_id: { $ref: "#/components/schemas/APIKeyID" }
        api_key_prefix: { type: string, pattern: "^[a-z0-9]{12}$" }
        scopes: { type: array, items: { type: string } }

    Channel:
      type: string
      enum: [email, sms, push, slack, outlook, whatsapp, webhook]
    RunStatus:
      type: string
      enum: [accepted, processing, completed, partially_failed, failed, canceled]
    NotificationStatus:
      type: string
      enum: [queued, deferred, sending, retrying, sent, delivered, sent_unconfirmed, failed, suppressed, canceled, expired]

    Recipient:
      type: object
      additionalProperties: false
      description: Recipient details are passed inline; Notifex keeps no subscriber model. Raw values are encrypted and purged after the tenant's retention period.
      properties:
        id: { type: string, maxLength: 128, description: Caller reference, echoed as recipient_ref. }
        email: { type: string, format: email, maxLength: 320 }
        phone: { type: string, pattern: "^\\+[1-9][0-9]{6,14}$", description: E.164 }
        push_tokens: { type: array, maxItems: 20, items: { type: string, maxLength: 4096 } }
        slack_user: { type: string, maxLength: 64 }
        whatsapp: { type: string, pattern: "^\\+[1-9][0-9]{6,14}$" }
        locale: { type: string, maxLength: 35 }
        timezone: { type: string, maxLength: 64, description: IANA zone, used by quiet hours. }

    TriggerRequest:
      type: object
      additionalProperties: false
      required: [workflow, recipients]
      properties:
        workflow: { type: string, minLength: 1, maxLength: 63, description: Workflow key. }
        recipients:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/Recipient" }
        payload: { type: object, description: Validated against the workflow's payload schema, if any. }
        context: { type: object, description: Caller metadata (not rendered). }
        channels:
          type: array
          description: Narrows the workflow's channels; can never add channels.
          items: { $ref: "#/components/schemas/Channel" }
          uniqueItems: true
        schedule_at:
          type: string
          format: date-time
          description: At most now + 7 days (ADR-006).

    NotificationRef:
      type: object
      additionalProperties: false
      required: [id, channel, status]
      properties:
        id: { $ref: "#/components/schemas/NotificationID" }
        channel: { $ref: "#/components/schemas/Channel" }
        recipient_ref: { type: string }
        status: { $ref: "#/components/schemas/NotificationStatus" }
        error: { $ref: "#/components/schemas/ErrorDetail" }

    TriggerResponse:
      type: object
      additionalProperties: false
      required: [run_id, status, notifications]
      properties:
        run_id: { $ref: "#/components/schemas/RunID" }
        status: { $ref: "#/components/schemas/RunStatus" }
        notifications:
          type: array
          items: { $ref: "#/components/schemas/NotificationRef" }

    Run:
      type: object
      additionalProperties: false
      required: [id, workflow, status, source, created_at, notifications]
      properties:
        id: { $ref: "#/components/schemas/RunID" }
        workflow: { type: string }
        status: { $ref: "#/components/schemas/RunStatus" }
        source: { type: string, description: "rest | grpc | connect | mcp | terraform | cli | webhook | sdk:<lang>" }
        created_at: { type: string, format: date-time }
        schedule_at: { type: [string, "null"], format: date-time }
        notifications:
          type: array
          items: { $ref: "#/components/schemas/NotificationRef" }
    RunList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Run" }
        next_cursor: { type: [string, "null"] }

    Notification:
      type: object
      additionalProperties: false
      required: [id, run_id, channel, status, recipient_masked, attempt, payload_expired, events]
      properties:
        id: { $ref: "#/components/schemas/NotificationID" }
        run_id: { $ref: "#/components/schemas/RunID" }
        channel: { $ref: "#/components/schemas/Channel" }
        status: { $ref: "#/components/schemas/NotificationStatus" }
        recipient_masked: { type: string, examples: ["a***@e***.com"] }
        attempt: { type: integer, minimum: 0 }
        last_error: { $ref: "#/components/schemas/ErrorDetail" }
        payload_expired:
          type: boolean
          description: True once the payload was purged; replay is no longer possible.
        events:
          type: array
          items: { $ref: "#/components/schemas/NotificationEvent" }
    NotificationEvent:
      type: object
      additionalProperties: false
      required: [type, at]
      properties:
        type: { type: string }
        at: { type: string, format: date-time }
        detail: { type: object, description: Redacted; never contains payload or raw recipients. }

    # ---------------------------------------------------------- Phase 1 schemas
    Email: { type: string, format: email, maxLength: 320 }
    Password:
      type: string
      format: password
      writeOnly: true
      minLength: 12
      maxLength: 128
      description: 12–128 characters; common passwords are rejected.
    SecretToken:
      type: string
      minLength: 20
      maxLength: 128
      writeOnly: true
      description: Single-use token from an email link.
    Role: { type: string, enum: [owner, admin, developer, viewer] }
    TenantStatus: { type: string, enum: [active, suspended, deleted] }
    NextCursor: { type: [string, "null"], description: Pass as `after` for the next page; null on the last page. }

    SignupRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { $ref: "#/components/schemas/Password" }
        name: { type: string, maxLength: 200 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { type: string, format: password, writeOnly: true, maxLength: 128 }
    ReauthRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, format: password, writeOnly: true, maxLength: 128 }
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { $ref: "#/components/schemas/Email" }
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { $ref: "#/components/schemas/SecretToken" }
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { $ref: "#/components/schemas/SecretToken" }
        password: { $ref: "#/components/schemas/Password" }
    OAuthAuthorizeRequest:
      type: object
      additionalProperties: false
      required: [redirect_uri]
      properties:
        redirect_uri: { type: string, format: uri, description: Must be on the configured allowlist. }
    OAuthAuthorizeResponse:
      type: object
      additionalProperties: false
      required: [authorization_url, state]
      properties:
        authorization_url: { type: string, format: uri }
        state: { type: string, description: Echoed back to /callback. }
    OAuthCallbackRequest:
      type: object
      additionalProperties: false
      required: [code, state]
      properties:
        code: { type: string, maxLength: 2048, writeOnly: true }
        state: { type: string, maxLength: 128 }
    OperatorLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, totp]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { type: string, format: password, writeOnly: true, maxLength: 128 }
        totp: { type: string, pattern: "^[0-9]{6}$", writeOnly: true }

    SessionCreated:
      type: object
      additionalProperties: false
      required: [token, session_id, expires_at]
      properties:
        token: { type: string, description: "Bearer token (nfs_… or nfo_…). Shown once; store it in an HttpOnly cookie." }
        session_id: { $ref: "#/components/schemas/SessionID" }
        expires_at: { type: string, format: date-time, description: Absolute expiry; idle expiry applies earlier. }
    Session:
      type: object
      additionalProperties: false
      required: [id, created_at, last_seen_at, current]
      properties:
        id: { $ref: "#/components/schemas/SessionID" }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        user_agent: { type: string, maxLength: 256 }
        current: { type: boolean, description: True for the session making this request. }
    SessionList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Session" } }

    User:
      type: object
      additionalProperties: false
      required: [id, email, name, email_verified]
      properties:
        id: { $ref: "#/components/schemas/UserID" }
        email: { $ref: "#/components/schemas/Email" }
        name: { type: string }
        email_verified: { type: boolean }
    Me:
      type: object
      additionalProperties: false
      required: [user, memberships]
      properties:
        user: { $ref: "#/components/schemas/User" }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/MyMembership" }
    MyMembership:
      type: object
      additionalProperties: false
      required: [tenant_id, tenant_name, tenant_slug, role]
      properties:
        tenant_id: { $ref: "#/components/schemas/TenantID" }
        tenant_name: { type: string }
        tenant_slug: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    Tenant:
      type: object
      additionalProperties: false
      required: [id, name, slug, status, plan, sandbox, created_at]
      properties:
        id: { $ref: "#/components/schemas/TenantID" }
        name: { type: string }
        slug: { type: string }
        status: { $ref: "#/components/schemas/TenantStatus" }
        plan: { type: string }
        sandbox: { type: boolean, description: New tenants are sandboxed until an operator lifts it. }
        created_at: { type: string, format: date-time }
    TenantCreate:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug: { type: string, pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$" }
    TenantPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }

    Member:
      type: object
      additionalProperties: false
      required: [id, user, role, created_at]
      properties:
        id: { $ref: "#/components/schemas/MembershipID" }
        user: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
    MemberPatch:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    MemberList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Member" } }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, role, expires_at, created_at]
      properties:
        id: { $ref: "#/components/schemas/InvitationID" }
        email: { $ref: "#/components/schemas/Email" }
        role: { $ref: "#/components/schemas/Role" }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    InvitationCreate:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        role: { $ref: "#/components/schemas/Role" }
    InvitationList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Invitation" } }

    Application:
      type: object
      additionalProperties: false
      required: [id, name, key, description, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/ApplicationID" }
        name: { type: string }
        key: { type: string, description: Stable slug, unique per tenant. }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ApplicationCreate:
      type: object
      additionalProperties: false
      required: [name, key]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        key: { type: string, pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$" }
        description: { type: string, maxLength: 2000 }
    ApplicationPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
    ApplicationList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Application" } }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
    Environment:
      type: object
      additionalProperties: false
      required: [id, application_id, name, created_at]
      properties:
        id: { $ref: "#/components/schemas/EnvironmentID" }
        application_id: { $ref: "#/components/schemas/ApplicationID" }
        name: { $ref: "#/components/schemas/EnvironmentName" }
        created_at: { type: string, format: date-time }
    EnvironmentCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { $ref: "#/components/schemas/EnvironmentName" }
    EnvironmentList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Environment" } }

    APIKey:
      type: object
      additionalProperties: false
      required: [id, environment_id, name, prefix, scopes, created_at]
      properties:
        id: { $ref: "#/components/schemas/APIKeyID" }
        environment_id: { $ref: "#/components/schemas/EnvironmentID" }
        name: { type: string }
        prefix: { type: string, pattern: "^[a-z0-9]{12}$", description: Public part of the key, for identification. }
        scopes: { type: array, items: { type: string } }
        expires_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time, description: Updated at most once a minute. }
        revoked_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    APIKeyCreate:
      type: object
      additionalProperties: false
      required: [environment_id, name]
      properties:
        environment_id: { $ref: "#/components/schemas/EnvironmentID" }
        name: { type: string, minLength: 1, maxLength: 200 }
        scopes: { type: array, items: { type: string, maxLength: 64 }, maxItems: 32 }
        expires_at: { type: string, format: date-time }
    APIKeyCreated:
      type: object
      additionalProperties: false
      required: [api_key, key]
      properties:
        api_key: { $ref: "#/components/schemas/APIKey" }
        key: { type: string, readOnly: true, description: The full key. Returned once; only a hash is stored. }
    APIKeyRotate:
      type: object
      additionalProperties: false
      properties:
        grace_period_seconds:
          type: integer
          minimum: 0
          maximum: 604800
          default: 86400
          description: How long the old key keeps working (max 7 days).
    APIKeyRotated:
      type: object
      additionalProperties: false
      required: [api_key, key, old_key_revoked_at]
      properties:
        api_key: { $ref: "#/components/schemas/APIKey" }
        key: { type: string, readOnly: true, description: The new full key. Returned once. }
        old_key_revoked_at: { type: string, format: date-time }
    APIKeyList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/APIKey" } }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }

    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, actor_type, actor_id, action, entity_type, entity_id, created_at]
      properties:
        id: { $ref: "#/components/schemas/AuditEventID" }
        actor_type: { type: string, enum: [user, api_key, operator, system] }
        actor_id: { type: string }
        action: { type: string, examples: ["api_key.create"] }
        entity_type: { type: string }
        entity_id: { type: string }
        before: { type: [object, "null"], description: Redacted. }
        after: { type: [object, "null"], description: Redacted. }
        request_id: { type: string }
        created_at: { type: string, format: date-time }
    AuditEventList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }

    Identity:
      type: object
      additionalProperties: false
      required: [provider, email, created_at, last_used_at]
      properties:
        provider: { type: string, enum: [google, microsoft, github] }
        email: { type: string, description: Email the provider asserted when linked (informational). }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
    IdentityList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Identity" } }

    OperatorTenant:
      type: object
      additionalProperties: false
      required: [id, name, slug, status, plan, sandbox, platform_sms_daily_limit, quotas, dek_shredded, created_at]
      properties:
        id: { $ref: "#/components/schemas/TenantID" }
        name: { type: string }
        slug: { type: string }
        status: { $ref: "#/components/schemas/TenantStatus" }
        plan: { type: string }
        sandbox: { type: boolean }
        platform_sms_daily_limit: { type: integer, minimum: 0 }
        quotas: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        dek_shredded: { type: boolean }
        created_at: { type: string, format: date-time }
    OperatorTenantPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status: { type: string, enum: [active, suspended], description: Deletion is owner-only (crypto-shred), not an operator action. }
        plan: { type: string, minLength: 1, maxLength: 64 }
        sandbox: { type: boolean }
        platform_sms_daily_limit: { type: integer, minimum: 0 }
        quotas: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        reason: { type: string, maxLength: 500, description: Recorded in the audit event. }
    OperatorTenantList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/OperatorTenant" } }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
