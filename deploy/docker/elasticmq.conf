# ElasticMQ (SQS-compatible) for local dev and integration tests.
# Mirrors the Terraform sqs-dispatch module: one standard queue per channel,
# each with a DLQ (maxReceiveCount 5) that only catches poison messages (ADR-004).
# Queue names: notifex-{env}-dispatch-{channel}; env is "local" here.
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"  # build queue URLs from the request Host header (works in and outside compose)
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

aws {
  region = ap-south-1
  accountId = 000000000000
}

queues {
  notifex-local-dispatch-email-dlq {
    messageRetentionPeriod = 14 days
  }
  notifex-local-dispatch-email {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    messageRetentionPeriod = 4 days
    deadLettersQueue {
      name = "notifex-local-dispatch-email-dlq"
      maxReceiveCount = 5
    }
  }
  notifex-local-dispatch-sms-dlq {
    messageRetentionPeriod = 14 days
  }
  notifex-local-dispatch-sms {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    messageRetentionPeriod = 4 days
    deadLettersQueue {
      name = "notifex-local-dispatch-sms-dlq"
      maxReceiveCount = 5
    }
  }
  notifex-local-dispatch-push-dlq {
    messageRetentionPeriod = 14 days
  }
  notifex-local-dispatch-push {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    messageRetentionPeriod = 4 days
    deadLettersQueue {
      name = "notifex-local-dispatch-push-dlq"
      maxReceiveCount = 5
    }
  }
  notifex-local-dispatch-slack-dlq {
    messageRetentionPeriod = 14 days
  }
  notifex-local-dispatch-slack {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    messageRetentionPeriod = 4 days
    deadLettersQueue {
      name = "notifex-local-dispatch-slack-dlq"
      maxReceiveCount = 5
    }
  }
  notifex-local-dispatch-outlook-dlq {
    messageRetentionPeriod = 14 days
  }
  notifex-local-dispatch-outlook {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    messageRetentionPeriod = 4 days
    deadLettersQueue {
      name = "notifex-local-dispatch-outlook-dlq"
      maxReceiveCount = 5
    }
  }
  notifex-local-dispatch-whatsapp-dlq {
    messageRetentionPeriod = 14 days
  }
  notifex-local-dispatch-whatsapp {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    messageRetentionPeriod = 4 days
    deadLettersQueue {
      name = "notifex-local-dispatch-whatsapp-dlq"
      maxReceiveCount = 5
    }
  }
  notifex-local-dispatch-webhook-dlq {
    messageRetentionPeriod = 14 days
  }
  notifex-local-dispatch-webhook {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    messageRetentionPeriod = 4 days
    deadLettersQueue {
      name = "notifex-local-dispatch-webhook-dlq"
      maxReceiveCount = 5
    }
  }
}
