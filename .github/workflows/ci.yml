name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Tool versions are pinned in the Makefile; jobs call `make <target>` so local
# and CI gates are identical.
# TODO(stage-2): pin third-party actions by commit SHA (Dependabot keeps them fresh).

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/cache@v6
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - name: go mod tidy is clean
        run: go mod tidy -diff
      - run: make lint

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Docker is available on ubuntu runners for testcontainers (Postgres, ElasticMQ) from slice 3.
      - run: make test
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  vuln:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make vuln

  proto:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make buf-lint
      # `buf breaking --against '.git#branch=main'` is enabled once the API is served (Phase 4).

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1

  image:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build linux/arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/core.Dockerfile
          platforms: linux/arm64
          build-args: VERSION=${{ github.sha }}
          tags: notifex-core:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan (fail on critical/high)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: notifex-core:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Image size
        run: docker image inspect notifex-core:ci --format '{{.Size}}' | numfmt --to=iec
